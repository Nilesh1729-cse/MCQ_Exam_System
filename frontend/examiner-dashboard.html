<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Examiner Dashboard | ExamPortal</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="dash-shell">
    <nav class="dash-nav"><div class="brand-mark"><span class="dot"></span> ExamPortal · Examiner</div><button class="btn-logout" id="logout-btn">Sign out</button></nav>
    <main class="dash-main">
      <p class="eyebrow">Examiner Portal</p><h1>Welcome<span id="welcome-name"></span>.</h1>
      <div class="alert" data-alert></div>
      <div class="card-grid" style="margin-bottom: 2rem;">
        <div class="info-card"><div class="label">Name</div><div class="value" data-field="name"></div></div>
        <div class="info-card"><div class="label">Email</div><div class="value" data-field="email"></div></div>
        <div class="info-card"><div class="label">Member since</div><div class="value" data-field="created_at"></div></div>
      </div>
      <button class="btn btn-primary" id="toggle-form-btn" style="width: auto; margin-bottom: 1.5rem;">+ Add New Question</button>
      <section id="examiner-section" class="info-card" style="display: none; margin-bottom: 2rem;">
        <h2>Add a question</h2><p id="question-msg" aria-live="polite"></p>
        <form id="question-form">
          <div class="field"><label for="question_text">Question</label><input id="question_text" required maxlength="1000" /></div>
          <div class="field"><label for="option_a">Option A</label><input id="option_a" required maxlength="255" /></div>
          <div class="field"><label for="option_b">Option B</label><input id="option_b" required maxlength="255" /></div>
          <div class="field"><label for="option_c">Option C</label><input id="option_c" required maxlength="255" /></div>
          <div class="field"><label for="option_d">Option D</label><input id="option_d" required maxlength="255" /></div>
          <div class="field"><label for="correct_option">Correct answer</label><select id="correct_option" required><option value="A">A</option><option value="B">B</option><option value="C">C</option><option value="D">D</option></select></div>
          <button class="btn btn-primary" type="submit">Save question</button>
        </form>
      </section>
      <h2>Question bank (maximum 10)</h2>
      <div id="questions-list" style="display: flex; flex-direction: column; gap: 1rem; margin-top: 1rem;"></div>
    </main>
  </div>
  <script src="js/api.js"></script><script src="js/ui.js"></script><script src="js/examiner-dashboard.js"></script>
</body>
</html>
